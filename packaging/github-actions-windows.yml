name: Windows application
on:
  workflow_dispatch:
  push:
    paths-ignore: ['**/*.md']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tools -p "test_*.py"
      - name: Build Windows packages
        shell: pwsh
        run: |
          $taskCompiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path -LiteralPath $taskCompiler) {
            python tools/build_windows.py --inno $taskCompiler
          } else {
            python tools/build_windows.py
          }
      - uses: actions/upload-artifact@v4
        with:
          name: STVideo-Windows
          path: |
            dist/*.zip
            dist/*Setup.exe
            dist/SHA256SUMS.txt
